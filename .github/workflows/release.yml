name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'aayushostwal/aws-mcp-turbo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate tag, version, notes, and main ancestry
        run: |
          node scripts/check-release.mjs "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: make check
      - run: go test -race ./...
      - run: make vuln
      - run: make build
      - run: node scripts/stdio-smoke.mjs
      - run: node scripts/npm-smoke.mjs
      - run: node scripts/release.mjs "${GITHUB_REF_NAME}"
      - name: Verify release binary
        run: |
          cd dist
          sha256sum --check checksums.txt
          test "$("./aws-mcp-turbo_${GITHUB_REF_NAME}_linux_amd64" --version)" = "$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/aws-mcp-turbo_*
      - name: Publish GitHub binaries before npm
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "aws-mcp-turbo $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Pin an OIDC-capable npm CLI rather than relying on Node's bundled version.
      - run: npm install --global npm@11.20.0 --ignore-scripts
      - run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - name: Test wrapper against public binary release
        run: node scripts/npm-public-smoke.mjs --local
      - name: Publish npm using trusted publishing
        run: node scripts/publish-npm.mjs
      - name: Verify public npx installation and MCP
        run: node scripts/npm-public-smoke.mjs
